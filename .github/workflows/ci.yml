name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  # Pull requests into main must beat the recorded SOTA (docs/BRANCHING.md).
  sota-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-zh-v1.5
      - run: python -m pip install -e '.[dev]'
      - run: python -m bench.run_retrieval --split test --out bench/results/candidate.json
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      - run: python -m bench.gate bench/results/candidate.json --system "${SOTA_CANDIDATE:-v1-hybrid}"
