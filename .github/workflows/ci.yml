name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  # Pull requests into main must beat the recorded SOTA (docs/BRANCHING.md).
  sota-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-jina-v2-base-zh-bge-small-zh
      - run: python -m pip install -e '.[dev]'
      - name: SOTA record on the base branch
        run: |
          git show "origin/${{ github.base_ref }}:bench/sota.json" > /tmp/sota.json \
            || cp bench/baseline_v0.json /tmp/sota.json   # first promotion: base predates the benchmark
          cat /tmp/sota.json
      - run: python -m bench.run_retrieval --split test --systems "$CANDIDATE" --out bench/results/candidate.json
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
          CANDIDATE: v2-hybrid
      - run: python -m bench.gate bench/results/candidate.json --system v2-hybrid --sota /tmp/sota.json
