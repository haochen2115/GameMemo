name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  # Pull requests into main must beat the recorded SOTA (docs/BRANCHING.md).
  sota-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-jina-v2-base-zh-bge-small-zh
      - run: python -m pip install -e '.[dev]'
      - name: SOTA records on the base branch
        run: |
          mkdir -p /tmp/base
          for f in sota.json sota_e2e.json; do
            git show "origin/${{ github.base_ref }}:bench/$f" > "/tmp/base/$f" 2>/dev/null || rm -f "/tmp/base/$f"
          done
          ls -l /tmp/base
      - name: Retrieval benchmark for the declared candidate
        run: |
          SYSTEM=$(python -c "import json; print(json.load(open('bench/candidate.json'))['retrieval']['system'])")
          python -m bench.run_retrieval --split test --systems "$SYSTEM" --out bench/results/candidate.json
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      - run: python -m bench.gate --candidate bench/candidate.json --base-dir /tmp/base
