[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamememo"
version = "2.0.0a1"
description = "A research preview for shared memory in multi-tenant agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hao Chen" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gamememo = "gamememo.cli:main"

[tool.setuptools]
packages = ["gamememo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
